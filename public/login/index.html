<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>For Nikki's eyes only</title>
<style>
  :root {
    --paper: #efe4cf; --ink: #4a342a; --burgundy: #7c3a45; --gold: #b98a3e;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: Georgia, "Times New Roman", serif; color: var(--ink);
    background:
      radial-gradient(ellipse at 20% 10%, rgba(185,138,62,.12), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(124,58,69,.10), transparent 55%),
      var(--paper);
  }
  .card {
    width: min(400px, 100%); padding: 48px 36px; text-align: center;
    background: #f6eeda; border: 1px solid rgba(74,52,42,.18);
    box-shadow: 0 18px 40px rgba(74,52,42,.22), 0 2px 6px rgba(74,52,42,.12);
    transform: rotate(-1deg); border-radius: 3px;
  }
  .lock { font-size: 34px; }
  h1 { font-weight: 500; font-size: 22px; letter-spacing: .06em; margin: 14px 0 6px; }
  p  { font-size: 14px; opacity: .75; line-height: 1.5; }
  form { margin-top: 26px; display: grid; gap: 12px; }
  input {
    width: 100%; padding: 12px 14px; font-size: 16px; text-align: center;
    border: 1px solid rgba(74,52,42,.35); border-radius: 2px;
    background: #fdf8ec; color: var(--ink); outline: none;
  }
  input:focus { border-color: var(--gold); }
  button {
    padding: 12px; font: inherit; font-size: 15px; letter-spacing: .12em;
    text-transform: uppercase; cursor: pointer; color: #f6eeda;
    background: var(--burgundy); border: none; border-radius: 2px;
    transition: background .2s;
  }
  button:hover { background: #66303a; }
  .error { color: var(--burgundy); font-size: 13px; min-height: 18px; margin-top: 10px; font-family: Verdana, sans-serif; }
  .hint { margin-top: 22px; font-size: 12px; opacity: .55; font-style: italic; }
</style>
</head>
<body>
  <div class="card">
    <div class="lock" aria-hidden="true">&#128274;</div>
    <h1>THE ONE GAME I NEVER WON</h1>
    <p>This scrapbook is sealed and made for one person.</p>
    <form method="post" onsubmit="return submitForm(event)">
      <input type="password" id="pw" placeholder="the password, love" autocomplete="current-password" aria-label="Password" required>
      <button type="submit">Open the scrapbook</button>
    </form>
    <div class="error" id="err" role="alert"></div>
    <div class="hint">A word two chess players would know by heart.</div>
  </div>
<script>
async function submitForm(e) {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  const r = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: document.getElementById('pw').value })
  });
  if (r.ok) { location.href = '/'; return false; }
  const data = await r.json().catch(() => ({}));
  err.textContent = data.error || 'Wrong password. Try again, love.';
  return false;
}
</script>
</body>
</html>
